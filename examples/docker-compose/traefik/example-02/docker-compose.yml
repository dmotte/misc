---
services:
  traefik:
    # Tested with docker.io/library/traefik:v3.7.10
    # Note: when upgrading between different Traefik minor versions, see
    # https://doc.traefik.io/traefik/migrate/v3/
    image: docker.io/library/traefik:v3.7
    restart: always
    network_mode: bridge
    ports: ["80:80", "443:443"]
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server.crt:/etc/traefik/server.crt:ro
      - ./server.key:/etc/traefik/server.key:ro

  foo:
    image: docker.io/traefik/whoami:v1.10
    restart: always
    network_mode: bridge
    hostname: foo
    labels:
      traefik.enable: true
      traefik.http.routers.foo.rule: Host(`foo.example.com`)
      traefik.http.routers.foo.entryPoints: websecure

  bar:
    image: docker.io/traefik/whoami:v1.10
    restart: always
    network_mode: bridge
    hostname: bar
    labels:
      traefik.enable: true
      traefik.http.routers.bar.rule: Host(`bar.example.com`)
      traefik.http.routers.bar.entryPoints: websecure
