---
services:
  traefik:
    # Tested with docker.io/library/traefik:v3.7.10
    # Note: when upgrading between different Traefik minor versions, see
    # https://doc.traefik.io/traefik/migrate/v3/
    image: docker.io/library/traefik:v3.7
    restart: always
    network_mode: bridge
    ports: ["80:80", "443:443"]
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./acme.json:/etc/traefik/acme.json

  foo:
    image: docker.io/traefik/whoami:v1.10
    restart: always
    network_mode: bridge
    hostname: foo
    command: -port 8080
    labels:
      traefik.enable: true
      traefik.http.services.foo.loadbalancer.server.port: 8080
      traefik.http.routers.foo.entryPoints: websecure

  bar:
    image: docker.io/traefik/whoami:v1.10
    restart: always
    network_mode: bridge
    hostname: bar
    labels:
      traefik.enable: true
      traefik.http.routers.bar.entryPoints: websecure
